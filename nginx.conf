server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  types {
    text/html html; text/css css; application/javascript js mjs;
    image/webp webp; image/jpeg jpg jpeg; image/png png; image/svg+xml svg;
    model/gltf-binary glb; application/octet-stream wasm bin;
    application/json json; text/plain txt;
  }
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location ~* \.(glb|wasm|js|css|webp|jpg|png|svg)$ { expires 30d; add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
